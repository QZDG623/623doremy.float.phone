name: Export Signing Keystore (temporary)

# 临时：把仓库 Secret 里的签名 keystore 导出成 artifact，供持有人取回本地备份。
# 用途完成、密钥已取回后应立刻删除本文件与其 artifact / 运行记录。
on:
  workflow_dispatch:
  push:
    paths: [".trigger-export-keystore"]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write keystore from secret
        env:
          B64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
        run: |
          mkdir -p out
          printf '%s' "$B64" | tr -dc 'A-Za-z0-9+/=' | base64 -d > out/doremy-release.jks
          # 指纹是公开信息，打进日志用于核对；密钥本身不进日志
          keytool -list -v -keystore out/doremy-release.jks \
            -storepass "${{ secrets.SHELL_KEYSTORE_PASSWORD }}" | grep -E 'Alias name|SHA256:|SHA1:'
          sha256sum out/doremy-release.jks

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore-tmp
          path: out/doremy-release.jks
          retention-days: 1
